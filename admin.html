<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drews Shoes — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Manrope', sans-serif; background: #f2f2f2; color: #111; -webkit-font-smoothing: antialiased; }

    .header {
      background: #111; padding: 0 32px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .header h1 { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
    .header a { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.45); text-decoration: none; letter-spacing: 0.5px; }
    .header a:hover { color: #fff; }

    .container { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

    /* TABS */
    .tabs { display: flex; gap: 4px; margin-bottom: 32px; border-bottom: 1px solid #ddd; }
    .tab {
      padding: 10px 20px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; border: none; background: none;
      color: #999; border-bottom: 2px solid transparent; margin-bottom: -1px;
      font-family: 'Manrope', sans-serif; transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: #111; border-bottom-color: #111; }
    .tab:hover { color: #111; }

    /* FORM */
    .form-card {
      background: #fff; border-radius: 14px; padding: 28px;
      border: 1px solid #e8e8e8; margin-bottom: 24px;
    }
    .form-card h2 { font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #111; margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #888; }
    input, select, textarea {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd;
      font-family: 'Manrope', sans-serif; font-size: 13px; color: #111;
      background: #fafafa; transition: border-color 0.15s;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #111; background: #fff; }
    textarea { resize: vertical; min-height: 60px; }

    .img-preview {
      width: 80px; height: 80px; border-radius: 8px;
      border: 1px solid #ddd; object-fit: contain; background: #fff;
      display: none;
    }
    .img-row { display: flex; align-items: center; gap: 12px; }
    .img-row input { flex: 1; }

    .btn-add {
      margin-top: 20px; padding: 12px 24px;
      background: #111; color: #fff; border: none;
      border-radius: 8px; font-family: 'Manrope', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.8; }

    /* PRODUCT LIST */
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-row {
      background: #fff; border-radius: 12px; border: 1px solid #e8e8e8;
      padding: 14px 16px; display: flex; align-items: center; gap: 14px;
    }
    .product-thumb {
      width: 56px; height: 56px; border-radius: 8px;
      object-fit: contain; background: #f5f5f5; flex-shrink: 0;
      border: 1px solid #eee;
    }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 13px; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-meta { font-size: 11px; color: #999; margin-top: 2px; }
    .product-price { font-size: 15px; font-weight: 800; color: #111; flex-shrink: 0; }
    .product-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-status {
      padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      font-family: 'Manrope', sans-serif; transition: opacity 0.15s;
    }
    .btn-status.in-stock { background: #f0f0f0; color: #555; }
    .btn-status.sold { background: #fee2e2; color: #dc2626; }
    .btn-delete {
      padding: 5px 10px; border-radius: 6px; border: 1px solid #eee;
      background: #fff; color: #bbb; cursor: pointer;
      font-size: 10px; font-weight: 700; font-family: 'Manrope', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-delete:hover { color: #dc2626; border-color: #dc2626; }

    .empty { text-align: center; padding: 40px; color: #bbb; font-size: 13px; }

    /* EXPORT */
    .export-card {
      background: #111; border-radius: 14px; padding: 24px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      margin-top: 40px;
    }
    .export-info h3 { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .export-info p { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.5; }
    .btn-export {
      padding: 12px 24px; background: #fff; color: #111;
      border: none; border-radius: 8px; font-family: 'Manrope', sans-serif;
      font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .btn-export:hover { opacity: 0.85; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #111; color: #fff; padding: 12px 24px; border-radius: 8px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; z-index: 999;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .export-card { flex-direction: column; }
    }
  </style>
</head>
<body>

<header class="header">
  <h1>DREWS SHOES — Admin</h1>
  <a href="index.html">← View Site</a>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('sneakers')">Sneakers</button>
    <button class="tab" onclick="switchTab('streetwear')">Streetwear</button>
    <button class="tab" onclick="switchTab('cards')">Trading Cards</button>
  </div>

  <!-- ADD FORM -->
  <div class="form-card">
    <h2>Add Product</h2>
    <div class="form-grid">
      <div class="form-group full">
        <label>Product Name</label>
        <input type="text" id="inputName" placeholder='e.g. Nike Kobe 5 Protro "Hall of Fame"'>
      </div>
      <div class="form-group" id="sizeGroup">
        <label>Size (US)</label>
        <input type="number" id="inputSize" step="0.5" placeholder="e.g. 10">
      </div>
      <div class="form-group" id="metaGroup" style="display:none;">
        <label>Size / Description</label>
        <input type="text" id="inputMeta" placeholder='e.g. Size L, One Size, Hobby Box'>
      </div>
      <div class="form-group">
        <label>Price</label>
        <input type="text" id="inputPrice" placeholder="e.g. $240">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="inputStatus">
          <option value="in-stock">In Stock</option>
          <option value="sold">Sold</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Image Path or URL</label>
        <div class="img-row">
          <input type="text" id="inputImage" placeholder="images/products/filename.jpg" oninput="previewImg(this.value)">
          <img class="img-preview" id="imgPreview" src="" alt="preview">
        </div>
      </div>
      <div class="form-group full">
        <label>Additional Images (one per line)</label>
        <textarea id="inputImages" placeholder="images/products/shoe-side.jpg&#10;images/products/shoe-sole.jpg"></textarea>
      </div>
    </div>
    <button class="btn-add" onclick="addProduct()">Add Product</button>
  </div>

  <!-- PRODUCT LIST -->
  <div class="product-list" id="productList"></div>

  <!-- EXPORT -->
  <div class="export-card">
    <div class="export-info">
      <h3>Export & Update Site</h3>
      <p>Downloads an updated main.js — replace the file<br>in your site folder and re-upload to GitHub.</p>
    </div>
    <button class="btn-export" onclick="exportJS()">Download main.js</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ================================
//  DEFAULT DATA (from your current main.js)
// ================================
const defaultData = {
  sneakers: [
    { name: 'Nike Mind 001 Flyknit "Bronze Eclipse / Total Orange"', size: 7, price: "$155", status: "in-stock", image: "images/products/mind-001-IR2175-200.jpg", images: ["images/products/mind-001-IR2175-200.jpg"] },
    { name: 'Nike Mind 001 Flyknit "Bronze Eclipse / Total Orange"', size: 15, price: "$280", status: "in-stock", image: "images/products/mind-001-IR2175-200.jpg", images: ["images/products/mind-001-IR2175-200.jpg"] },
    { name: 'Air Jordan 3 PRM "BIN23"', size: 9, price: "$650", status: "in-stock", image: "images/products/jordan-3-bin23-IO7744-600.jpg", images: ["images/products/jordan-3-bin23-IO7744-600.jpg"] },
    { name: 'Nike Kobe 5 Protro "Caitlin Clark Rookie of the Year"', size: 9.5, price: "$240", status: "in-stock", image: "images/products/kobe-5-IV2712-001.jpg", images: ["images/products/kobe-5-IV2712-001.jpg"] },
    { name: 'Nike Kobe 5 Protro "Caitlin Clark Rookie of the Year"', size: 11.5, price: "$240", status: "in-stock", image: "images/products/kobe-5-IV2712-001.jpg", images: ["images/products/kobe-5-IV2712-001.jpg"] },
    { name: 'Nike Air Jordan 17 "Doernbecher Freestyle"', size: 10, price: "$295", status: "in-stock", image: "images/products/aj17-dorenbecher-IO7684-921.jpg", images: ["images/products/aj17-dorenbecher-IO7684-921.jpg"] }
  ],
  streetwear: [
    { name: "Supreme Ushanka Hat", meta: "S/M", price: "$100", status: "in-stock", image: "images/products/supreme-ushanka.jpg", images: ["images/products/supreme-ushanka.jpg"] }
  ],
  cards: [
    { name: "Topps 2025-26 NBA Hoops", meta: "Hobby Box", price: "$230", status: "in-stock", image: "images/products/topps-hoops-hobby.jpg", images: ["images/products/topps-hoops-hobby.jpg"] }
  ]
};

// ================================
//  STATE
// ================================
let currentTab = "sneakers";
let data = JSON.parse(localStorage.getItem("drews-admin-data") || JSON.stringify(defaultData));

function save() {
  localStorage.setItem("drews-admin-data", JSON.stringify(data));
}

// ================================
//  TABS
// ================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach((t, i) => {
    t.classList.toggle("active", ["sneakers","streetwear","cards"][i] === tab);
  });
  // Toggle size vs meta field
  const isSneakers = tab === "sneakers";
  document.getElementById("sizeGroup").style.display = isSneakers ? "" : "none";
  document.getElementById("metaGroup").style.display = isSneakers ? "none" : "";
  renderList();
}

// ================================
//  IMAGE PREVIEW
// ================================
function previewImg(src) {
  const img = document.getElementById("imgPreview");
  if (src) { img.src = src; img.style.display = "block"; }
  else img.style.display = "none";
}

// ================================
//  ADD PRODUCT
// ================================
function addProduct() {
  const name = document.getElementById("inputName").value.trim();
  const price = document.getElementById("inputPrice").value.trim();
  const status = document.getElementById("inputStatus").value;
  const image = document.getElementById("inputImage").value.trim();
  const extraImages = document.getElementById("inputImages").value.trim().split("\n").map(s => s.trim()).filter(Boolean);
  const images = image ? [image, ...extraImages] : extraImages;

  if (!name || !price) { showToast("Name and price are required"); return; }

  const item = { name, price, status, image: image || "", images };

  if (currentTab === "sneakers") {
    const size = parseFloat(document.getElementById("inputSize").value);
    if (!size) { showToast("Size is required for sneakers"); return; }
    item.size = size;
  } else {
    item.meta = document.getElementById("inputMeta").value.trim();
  }

  data[currentTab].push(item);
  save();
  renderList();
  clearForm();
  showToast("Product added!");
}

function clearForm() {
  ["inputName","inputSize","inputMeta","inputPrice","inputImage","inputImages"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("inputStatus").value = "in-stock";
  document.getElementById("imgPreview").style.display = "none";
}

// ================================
//  RENDER LIST
// ================================
function renderList() {
  const list = document.getElementById("productList");
  const items = data[currentTab];

  if (!items.length) {
    list.innerHTML = '<div class="empty">No products yet — add one above.</div>';
    return;
  }

  list.innerHTML = items.map((item, i) => {
    const meta = item.meta || (item.size ? "Size US " + item.size : "");
    const isSold = item.status === "sold";
    return `
      <div class="product-row">
        <img class="product-thumb" src="${item.image}" onerror="this.src=''" alt="${item.name}">
        <div class="product-info">
          <div class="product-name">${item.name}</div>
          <div class="product-meta">${meta}</div>
        </div>
        <div class="product-price">${item.price}</div>
        <div class="product-actions">
          <button class="btn-status ${isSold ? 'sold' : 'in-stock'}" onclick="toggleStatus(${i})">
            ${isSold ? 'Sold' : 'In Stock'}
          </button>
          <button class="btn-delete" onclick="deleteProduct(${i})">Remove</button>
        </div>
      </div>
    `;
  }).join("");
}

// ================================
//  TOGGLE STATUS
// ================================
function toggleStatus(i) {
  data[currentTab][i].status = data[currentTab][i].status === "sold" ? "in-stock" : "sold";
  save();
  renderList();
  showToast("Status updated");
}

// ================================
//  DELETE
// ================================
function deleteProduct(i) {
  if (!confirm("Remove this product?")) return;
  data[currentTab].splice(i, 1);
  save();
  renderList();
  showToast("Product removed");
}

// ================================
//  EXPORT main.js
// ================================
function exportJS() {
  const EMAIL = "drewssshoes@definiteim.com";
  const IG_URL = "https://ig.me/m/drewsshoes_";

  function serialize(arr) {
    return JSON.stringify(arr, null, 2);
  }

  const js = `// ================================
//  SNEAKERS — add items here
// ================================
const shoes = ${serialize(data.sneakers)};

// ================================
//  STREETWEAR — add items here
// ================================
const streetwear = ${serialize(data.streetwear)};

// ================================
//  TRADING CARDS — add items here
// ================================
const cards = ${serialize(data.cards)};

// ================================
//  LIGHTBOX
// ================================
let lbImages = [];
let lbIndex = 0;

function buildLightbox() {
  const lb = document.createElement("div");
  lb.className = "lightbox-overlay";
  lb.id = "lightbox";
  lb.innerHTML = \`
    <button class="lightbox-close" id="lbClose">&#x2715;</button>
    <div class="lightbox-inner">
      <div class="lightbox-img-wrap">
        <button class="lightbox-arrow prev" id="lbPrev">&#8249;</button>
        <img class="lightbox-img" id="lbImg" src="" alt="">
        <button class="lightbox-arrow next" id="lbNext">&#8250;</button>
      </div>
      <div class="lightbox-info">
        <p class="lightbox-name" id="lbName"></p>
        <p class="lightbox-meta" id="lbMeta"></p>
      </div>
      <div class="lightbox-dots" id="lbDots"></div>
    </div>
  \`;
  document.body.appendChild(lb);
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLightbox(); });
  document.getElementById("lbPrev").addEventListener("click", (e) => { e.stopPropagation(); lbGo(lbIndex - 1); });
  document.getElementById("lbNext").addEventListener("click", (e) => { e.stopPropagation(); lbGo(lbIndex + 1); });
  document.addEventListener("keydown", (e) => {
    if (!document.getElementById("lightbox").classList.contains("active")) return;
    if (e.key === "ArrowLeft") lbGo(lbIndex - 1);
    if (e.key === "ArrowRight") lbGo(lbIndex + 1);
    if (e.key === "Escape") closeLightbox();
  });
}

function openLightbox(item, startIndex) {
  lbImages = item.images && item.images.length ? item.images : [item.image];
  lbIndex = startIndex || 0;
  const displayMeta = item.meta || (item.size ? "Size US " + item.size : "");
  document.getElementById("lbName").textContent = item.name;
  document.getElementById("lbMeta").textContent = displayMeta + "  ·  " + item.price;
  const dotsEl = document.getElementById("lbDots");
  dotsEl.innerHTML = "";
  if (lbImages.length > 1) {
    lbImages.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "lightbox-dot" + (i === lbIndex ? " active" : "");
      dot.addEventListener("click", () => lbGo(i));
      dotsEl.appendChild(dot);
    });
  }
  lbGo(lbIndex);
  document.getElementById("lightbox").classList.add("active");
  document.body.style.overflow = "hidden";
}

function lbGo(index) {
  if (index < 0 || index >= lbImages.length) return;
  lbIndex = index;
  document.getElementById("lbImg").src = lbImages[lbIndex];
  document.getElementById("lbPrev").classList.toggle("hidden", lbIndex === 0);
  document.getElementById("lbNext").classList.toggle("hidden", lbIndex === lbImages.length - 1);
  document.querySelectorAll(".lightbox-dot").forEach((d, i) => {
    d.classList.toggle("active", i === lbIndex);
  });
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
  document.body.style.overflow = "";
}

// ================================
//  PURCHASE MODAL
// ================================
const EMAIL = "${EMAIL}";
const IG_URL = "${IG_URL}";

function buildModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "purchaseModal";
  overlay.innerHTML = \`
    <div class="modal">
      <p class="modal-title">Purchase</p>
      <p class="modal-product" id="modalProduct"></p>
      <p class="modal-meta" id="modalMeta"></p>
      <p class="modal-prompt">Please select a contact method to purchase this product.</p>
      <div class="modal-buttons">
        <a id="modalIG" href="\${IG_URL}" target="_blank" class="modal-btn modal-btn-ig">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2"/></svg>
          Instagram DM
        </a>
        <a id="modalEmail" href="#" class="modal-btn modal-btn-email">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Email
        </a>
      </div>
      <button class="modal-close" id="modalClose">Cancel</button>
    </div>
  \`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
}

function openModal(btn) {
  const name = btn.dataset.name;
  const meta = btn.dataset.meta;
  const price = btn.dataset.price;
  document.getElementById("modalProduct").textContent = name;
  document.getElementById("modalMeta").textContent = meta + "  ·  " + price;
  const subject = encodeURIComponent("Inquiry: " + name + (meta ? " - " + meta : ""));
  const body = encodeURIComponent("Hey Drew, is this still available?\\n\\n" + name + (meta ? "\\n" + meta : "") + "\\n\\nAsking price: " + price);
  document.getElementById("modalEmail").href = "mailto:" + EMAIL + "?subject=" + subject + "&body=" + body;
  document.getElementById("purchaseModal").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("purchaseModal").classList.remove("active");
  document.body.style.overflow = "";
}

// ================================
//  RENDER FUNCTION
// ================================
function renderGrid(gridId, items, countId) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  const countEl = document.getElementById(countId);
  const available = items.filter(i => i.status !== "sold").length;
  if (countEl) countEl.textContent = available + " available";
  if (items.length === 0) {
    grid.innerHTML = '<p style="color:#888; font-size:14px; grid-column:1/-1; padding: 40px 0;">No listings yet — check back soon.</p>';
    return;
  }
  items.forEach(item => {
    const isSold = item.status === "sold";
    const displayMeta = item.meta || (item.size ? "Size US " + item.size : "");
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="img-wrap">' +
        '<img src="' + item.image + '" alt="' + item.name + '" loading="lazy">' +
        '<div class="badge ' + (isSold ? "sold" : "available") + '">' + (isSold ? "Sold" : "Available") + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<p class="card-name">' + item.name + '</p>' +
        '<div class="card-meta-row"><span class="card-meta">' + displayMeta + '</span></div>' +
      '</div>' +
      '<div class="card-footer">' +
        '<span class="price">' + item.price + '</span>' +
        (isSold ? '<button class="btn disabled" disabled>Sold Out</button>' : '<button class="btn available purchase-btn">Purchase</button>') +
      '</div>';
    const imgWrap = card.querySelector(".img-wrap");
    imgWrap.addEventListener("click", function() { openLightbox(item, 0); });
    if (!isSold) {
      const btn = card.querySelector(".purchase-btn");
      btn.dataset.name = item.name;
      btn.dataset.meta = displayMeta;
      btn.dataset.price = item.price;
      btn.addEventListener("click", function(e) { e.stopPropagation(); openModal(this); });
    }
    grid.appendChild(card);
  });
}

// ================================
//  INIT
// ================================
document.addEventListener("DOMContentLoaded", function() {
  buildLightbox();
  buildModal();
  const seenShoes = [];
  const uniqueShoes = shoes.filter(s => {
    if (seenShoes.includes(s.name)) return false;
    seenShoes.push(s.name);
    return true;
  }).slice(0, 4);
  renderGrid("shoeGrid", uniqueShoes, null);
  renderGrid("streetwearGridHome", streetwear.slice(0, 4), null);
  renderGrid("cardsGridHome", cards.slice(0, 4), null);
  renderGrid("sneakerGrid", shoes, "sneakerCount");
  renderGrid("streetwearGrid", streetwear, "streetwearCount");
  renderGrid("cardsGrid", cards, "cardsCount");
});
`;

  const blob = new Blob([js], { type: "text/javascript" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "main.js";
  a.click();
  showToast("main.js downloaded!");
}

// ================================
//  TOAST
// ================================
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ================================
//  INIT
// ================================
renderList();
</script>
</body>
