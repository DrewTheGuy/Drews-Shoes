<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drews Shoes — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Manrope', sans-serif; background: #f2f2f2; color: #111; -webkit-font-smoothing: antialiased; }

    .header {
      background: #111; padding: 0 32px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .header h1 { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
    .header a { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.45); text-decoration: none; letter-spacing: 0.5px; }
    .header a:hover { color: #fff; }

    .container { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

    /* TABS */
    .tabs { display: flex; gap: 4px; margin-bottom: 32px; border-bottom: 1px solid #ddd; }
    .tab {
      padding: 10px 20px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; border: none; background: none;
      color: #999; border-bottom: 2px solid transparent; margin-bottom: -1px;
      font-family: 'Manrope', sans-serif; transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: #111; border-bottom-color: #111; }
    .tab:hover { color: #111; }

    /* FORM */
    .form-card {
      background: #fff; border-radius: 14px; padding: 28px;
      border: 1px solid #e8e8e8; margin-bottom: 24px;
    }
    .form-card h2 { font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #111; margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #888; }
    input, select, textarea {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd;
      font-family: 'Manrope', sans-serif; font-size: 13px; color: #111;
      background: #fafafa; transition: border-color 0.15s;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #111; background: #fff; }
    textarea { resize: vertical; min-height: 60px; }

    .img-preview {
      width: 80px; height: 80px; border-radius: 8px;
      border: 1px solid #ddd; object-fit: contain; background: #fff;
      display: none;
    }
    .img-row { display: flex; align-items: center; gap: 12px; }
    .img-row input { flex: 1; }

    .btn-add {
      margin-top: 20px; padding: 12px 24px;
      background: #111; color: #fff; border: none;
      border-radius: 8px; font-family: 'Manrope', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.8; }

    /* PRODUCT LIST */
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-row {
      background: #fff; border-radius: 12px; border: 1px solid #e8e8e8;
      padding: 14px 16px; display: flex; align-items: center; gap: 14px;
    }
    .product-thumb {
      width: 56px; height: 56px; border-radius: 8px;
      object-fit: contain; background: #f5f5f5; flex-shrink: 0;
      border: 1px solid #eee;
    }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 13px; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-meta { font-size: 11px; color: #999; margin-top: 2px; }
    .product-price { font-size: 15px; font-weight: 800; color: #111; flex-shrink: 0; }
    .product-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-status {
      padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      font-family: 'Manrope', sans-serif; transition: opacity 0.15s;
    }
    .btn-status.in-stock { background: #f0f0f0; color: #555; }
    .btn-status.sold { background: #fee2e2; color: #dc2626; }
    .btn-delete {
      padding: 5px 10px; border-radius: 6px; border: 1px solid #eee;
      background: #fff; color: #bbb; cursor: pointer;
      font-size: 10px; font-weight: 700; font-family: 'Manrope', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-delete:hover { color: #dc2626; border-color: #dc2626; }

    .empty { text-align: center; padding: 40px; color: #bbb; font-size: 13px; }

    /* EXPORT */
    .export-card {
      background: #111; border-radius: 14px; padding: 24px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      margin-top: 40px;
    }
    .export-info h3 { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .export-info p { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.5; }
    .btn-export {
      padding: 12px 24px; background: #fff; color: #111;
      border: none; border-radius: 8px; font-family: 'Manrope', sans-serif;
      font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .btn-export:hover { opacity: 0.85; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #111; color: #fff; padding: 12px 24px; border-radius: 8px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; z-index: 999;
    }
    .toast.show { opacity: 1; }

    .btn-edit {
      padding: 5px 10px; border-radius: 6px; border: 1px solid #ddd;
      background: #fff; color: #555; cursor: pointer;
      font-size: 10px; font-weight: 700; font-family: 'Manrope', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-edit:hover { color: #111; border-color: #111; }

    .edit-form {
      background: #f9f9f9; border: 1px solid #e0e0e0;
      border-radius: 12px; padding: 20px;
      margin-top: -6px; margin-bottom: 4px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .export-card { flex-direction: column; }
    }
  </style>
</head>
<body>

<header class="header">
  <h1>DREWS SHOES — Admin</h1>
  <a href="index.html">← View Site</a>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('sneakers')">Sneakers</button>
    <button class="tab" onclick="switchTab('streetwear')">Streetwear</button>
    <button class="tab" onclick="switchTab('cards')">Trading Cards</button>
  </div>

  <!-- ADD FORM -->
  <div class="form-card">
    <h2>Add Product</h2>
    <div class="form-grid">
      <div class="form-group full">
        <label>Product Name</label>
        <input type="text" id="inputName" placeholder='e.g. Nike Kobe 5 Protro "Hall of Fame"'>
      </div>
      <div class="form-group" id="sizeGroup">
        <label>Size (US)</label>
        <input type="number" id="inputSize" step="0.5" placeholder="e.g. 10">
      </div>
      <div class="form-group" id="metaGroup" style="display:none;">
        <label>Size / Description</label>
        <input type="text" id="inputMeta" placeholder='e.g. Size L, One Size, Hobby Box'>
      </div>
      <div class="form-group">
        <label>Price</label>
        <input type="text" id="inputPrice" placeholder="e.g. $240">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="inputStatus">
          <option value="in-stock">In Stock</option>
          <option value="sold">Sold</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Image Path or URL</label>
        <div class="img-row">
          <input type="text" id="inputImage" placeholder="images/products/filename.jpg" oninput="previewImg(this.value)">
          <img class="img-preview" id="imgPreview" src="" alt="preview">
        </div>
      </div>
      <div class="form-group full">
        <label>Additional Images (one per line)</label>
        <textarea id="inputImages" placeholder="images/products/shoe-side.jpg&#10;images/products/shoe-sole.jpg"></textarea>
      </div>
      <div class="form-group full">
        <label>Stripe Payment Link (optional)</label>
        <input type="text" id="inputStripe" placeholder="https://buy.stripe.com/...">
      </div>
    </div>
    <button class="btn-add" onclick="addProduct()">Add Product</button>
  </div>

  <!-- PRODUCT LIST -->
  <div class="product-list" id="productList"></div>

  <div id="statusBar" style="display:none; background:#fff; border:1px solid #e8e8e8; border-radius:12px; padding:14px 20px; margin-top:24px; font-size:12px; color:#888; font-weight:600; letter-spacing:0.5px;">
    Loading products from database...
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ================================
//  SUPABASE CONFIG
// ================================
const SUPABASE_URL = "https://jnxobqrlpdtpsumnwvde.supabase.co";
const SUPABASE_KEY = "sb_publishable_UK_x5tuLJIntL4-EFqCqKA_bx-3QXdT";

function sbHeaders() {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };
}

async function sbFetch(path, options = {}) {
  const res = await fetch(SUPABASE_URL + path, { headers: sbHeaders(), ...options });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

// Normalize a Supabase row to the shape the admin uses
function normalize(row) {
  return {
    id: row.id,
    name: row.name,
    category: row.category,
    size: row.size,
    meta: row.meta,
    price: row.price,
    status: row.status,
    stock: row.stock,
    image: row.image,
    images: (() => { try { return JSON.parse(row.images); } catch(e) { return [row.image]; } })(),
    stripeLink: row.stripe_link
  };
}

// ================================
//  STATE
// ================================
let currentTab = "sneakers";
let data = { sneakers: [], streetwear: [], cards: [] };

function setStatus(msg) {
  const bar = document.getElementById("statusBar");
  bar.style.display = msg ? "block" : "none";
  bar.textContent = msg;
}

// ================================
//  LOAD FROM SUPABASE
// ================================
async function loadProducts() {
  setStatus("Loading products...");
  try {
    const rows = await sbFetch("/rest/v1/products?select=*&order=id");
    data = { sneakers: [], streetwear: [], cards: [] };
    rows.forEach(row => {
      const item = normalize(row);
      if (data[item.category]) data[item.category].push(item);
    });
    setStatus("");
    renderList();
  } catch(e) {
    setStatus("Could not load products — check your connection.");
    console.error(e);
  }
}

// ================================
//  TABS
// ================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach((t, i) => {
    t.classList.toggle("active", ["sneakers","streetwear","cards"][i] === tab);
  });
  const isSneakers = tab === "sneakers";
  document.getElementById("sizeGroup").style.display = isSneakers ? "" : "none";
  document.getElementById("metaGroup").style.display = isSneakers ? "none" : "";
  renderList();
}

// ================================
//  IMAGE PREVIEW
// ================================
function previewImg(src) {
  const img = document.getElementById("imgPreview");
  if (src) { img.src = src; img.style.display = "block"; }
  else img.style.display = "none";
}

// ================================
//  ADD PRODUCT
// ================================
async function addProduct() {
  const name = document.getElementById("inputName").value.trim();
  const price = document.getElementById("inputPrice").value.trim();
  const status = document.getElementById("inputStatus").value;
  const image = document.getElementById("inputImage").value.trim();
  const extraImages = document.getElementById("inputImages").value.trim().split("\n").map(s => s.trim()).filter(Boolean);
  const images = image ? [image, ...extraImages] : extraImages;
  const stripeLink = document.getElementById("inputStripe").value.trim();

  if (!name || !price) { showToast("Name and price are required"); return; }

  const payload = {
    name, price, status, category: currentTab,
    image: image || "",
    images: JSON.stringify(images),
    stripe_link: stripeLink || null,
    stock: 1
  };

  if (currentTab === "sneakers") {
    const size = parseFloat(document.getElementById("inputSize").value);
    if (!size) { showToast("Size is required for sneakers"); return; }
    payload.size = size;
  } else {
    payload.meta = document.getElementById("inputMeta").value.trim();
  }

  try {
    const rows = await sbFetch("/rest/v1/products", {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const item = normalize(rows[0]);
    data[currentTab].push(item);
    renderList();
    clearForm();
    showToast("Product added!");
  } catch(e) {
    showToast("Failed to add product");
    console.error(e);
  }
}

function clearForm() {
  ["inputName","inputSize","inputMeta","inputPrice","inputImage","inputImages","inputStripe"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("inputStatus").value = "in-stock";
  document.getElementById("imgPreview").style.display = "none";
}

// ================================
//  RENDER LIST
// ================================
function renderList() {
  const list = document.getElementById("productList");
  const items = data[currentTab];

  if (!items || !items.length) {
    list.innerHTML = '<div class="empty">No products yet — add one above.</div>';
    return;
  }

  list.innerHTML = items.map((item, i) => {
    const meta = item.meta || (item.size ? "Size US " + item.size : "");
    const isSold = item.status === "sold" || item.stock <= 0;
    const isSneaker = currentTab === "sneakers";
    return `
      <div class="product-row" id="row-${i}">
        <img class="product-thumb" src="${item.image}" onerror="this.src=''" alt="${item.name}">
        <div class="product-info">
          <div class="product-name">${item.name}</div>
          <div class="product-meta">${meta}${item.stripeLink ? ' · <span style="color:#635bff;font-weight:700;">Stripe ✓</span>' : ''} · Stock: ${item.stock}</div>
        </div>
        <div class="product-price">${item.price}</div>
        <div class="product-actions">
          <button class="btn-status ${isSold ? 'sold' : 'in-stock'}" onclick="toggleStatus(${i})">
            ${isSold ? 'Sold' : 'In Stock'}
          </button>
          <button class="btn-edit" onclick="openEdit(${i})">Edit</button>
          <button class="btn-delete" onclick="deleteProduct(${i})">Remove</button>
        </div>
      </div>
      <div class="edit-form" id="edit-${i}" style="display:none;">
        <div class="form-grid">
          <div class="form-group full">
            <label>Product Name</label>
            <input type="text" id="edit-name-${i}" value="${item.name.replace(/"/g, '&quot;')}">
          </div>
          ${isSneaker ? `
          <div class="form-group">
            <label>Size (US)</label>
            <input type="number" id="edit-size-${i}" step="0.5" value="${item.size || ''}">
          </div>` : `
          <div class="form-group">
            <label>Size / Description</label>
            <input type="text" id="edit-meta-${i}" value="${(item.meta || '').replace(/"/g, '&quot;')}">
          </div>`}
          <div class="form-group">
            <label>Price</label>
            <input type="text" id="edit-price-${i}" value="${item.price}">
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input type="number" id="edit-stock-${i}" value="${item.stock}" min="0">
          </div>
          <div class="form-group full">
            <label>Image Path or URL</label>
            <input type="text" id="edit-image-${i}" value="${item.image}">
          </div>
          <div class="form-group full">
            <label>Stripe Payment Link (optional)</label>
            <input type="text" id="edit-stripe-${i}" value="${item.stripeLink || ''}" placeholder="https://buy.stripe.com/...">
          </div>
        </div>
        <div style="display:flex; gap:8px; margin-top:16px;">
          <button class="btn-add" style="margin-top:0;" onclick="saveEdit(${i})">Save Changes</button>
          <button class="btn-delete" style="padding:10px 16px;" onclick="closeEdit(${i})">Cancel</button>
        </div>
      </div>
    `;
  }).join("");
}

// ================================
//  TOGGLE STATUS
// ================================
async function toggleStatus(i) {
  const item = data[currentTab][i];
  const newStatus = item.status === "sold" ? "in-stock" : "sold";
  const newStock = newStatus === "sold" ? 0 : 1;
  try {
    await sbFetch(`/rest/v1/products?id=eq.${item.id}`, {
      method: "PATCH",
      body: JSON.stringify({ status: newStatus, stock: newStock })
    });
    item.status = newStatus;
    item.stock = newStock;
    renderList();
    showToast("Status updated");
  } catch(e) {
    showToast("Failed to update status");
    console.error(e);
  }
}

// ================================
//  DELETE
// ================================
async function deleteProduct(i) {
  if (!confirm("Remove this product?")) return;
  const item = data[currentTab][i];
  try {
    await sbFetch(`/rest/v1/products?id=eq.${item.id}`, { method: "DELETE" });
    data[currentTab].splice(i, 1);
    renderList();
    showToast("Product removed");
  } catch(e) {
    showToast("Failed to delete product");
    console.error(e);
  }
}

// ================================
//  EDIT PRODUCT
// ================================
function openEdit(i) {
  document.getElementById("edit-" + i).style.display = "block";
  document.getElementById("row-" + i).style.borderBottomLeftRadius = "0";
  document.getElementById("row-" + i).style.borderBottomRightRadius = "0";
}

function closeEdit(i) {
  document.getElementById("edit-" + i).style.display = "none";
  document.getElementById("row-" + i).style.borderBottomLeftRadius = "";
  document.getElementById("row-" + i).style.borderBottomRightRadius = "";
}

async function saveEdit(i) {
  const item = data[currentTab][i];
  const name = document.getElementById("edit-name-" + i).value.trim();
  const price = document.getElementById("edit-price-" + i).value.trim();
  const image = document.getElementById("edit-image-" + i).value.trim();
  const stripeVal = document.getElementById("edit-stripe-" + i).value.trim();
  const stock = parseInt(document.getElementById("edit-stock-" + i).value) || 0;

  const payload = {
    name, price, image,
    images: JSON.stringify(image ? [image] : []),
    stripe_link: stripeVal || null,
    stock,
    status: stock <= 0 ? "sold" : item.status
  };

  if (currentTab === "sneakers") {
    payload.size = parseFloat(document.getElementById("edit-size-" + i).value) || item.size;
  } else {
    payload.meta = document.getElementById("edit-meta-" + i).value.trim();
  }

  try {
    await sbFetch(`/rest/v1/products?id=eq.${item.id}`, {
      method: "PATCH",
      body: JSON.stringify(payload)
    });
    Object.assign(item, { name, price, image, images: [image], stripeLink: stripeVal || null, stock, status: payload.status });
    if (payload.size) item.size = payload.size;
    if (payload.meta !== undefined) item.meta = payload.meta;
    closeEdit(i);
    renderList();
    showToast("Product updated!");
  } catch(e) {
    showToast("Failed to save changes");
    console.error(e);
  }
}

// ================================
//  TOAST
// ================================
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ================================
//  INIT
// ================================
loadProducts();
</script>
</body>
</html>
